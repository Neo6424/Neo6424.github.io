<svg xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif" style="background:#151a17" viewBox="0 0 760 344" role="img" aria-label="NIPS·HIPS는 보는 곳에서 막고, WIPS·NBA는 다른 곳에서 막는다" font-size="13"><defs><marker id="ipst-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b8c75"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#eaf6ed">NIPS·HIPS는 보는 곳에서 막고, WIPS·NBA는 다른 곳에서 막는다</text><text x="24" y="50" font-size="11.5" fill="#a8bbad">색이 칠해진 상자 = 차단이 일어나는 곳</text><text x="290" y="84" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a8bbad">탐지 지점</text><text x="600" y="84" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a8bbad">차단 지점</text><line x1="24" x2="736" y1="94" y2="94" stroke="#304a37"></line><g><text x="24" y="128" font-weight="600" fill="#eaf6ed">NIPS</text><rect x="170" y="100" width="550" height="48" rx="8" fill="#96d5a8" fill-opacity="0.12" stroke="#96d5a8" stroke-width="2"></rect><text x="445" y="128" text-anchor="middle" fill="#eaf6ed">회선 한가운데(인라인): 보는 곳에서 바로 막음</text></g><g><text x="24" y="188" font-weight="600" fill="#eaf6ed">HIPS</text><rect x="170" y="160" width="550" height="48" rx="8" fill="#96d5a8" fill-opacity="0.12" stroke="#96d5a8" stroke-width="2"></rect><text x="445" y="188" text-anchor="middle" fill="#eaf6ed">호스트 내부(OS 훅): 실행 직전에 막음</text></g><g><text x="24" y="248" font-weight="600" fill="#eaf6ed">WIPS</text><rect x="170" y="220" width="240" height="48" rx="8" fill="none" stroke="#6b8c75" stroke-width="1.25"></rect><text x="290" y="248" text-anchor="middle" fill="#eaf6ed">공중 (모니터 모드 센서)</text><path d="M410 244H478" fill="none" stroke="#6b8c75" stroke-width="1.25" marker-end="url(#ipst-arrow)"></path><rect x="480" y="220" width="240" height="48" rx="8" fill="#96d5a8" fill-opacity="0.12" stroke="#96d5a8" stroke-width="2"></rect><text x="600" y="248" text-anchor="middle" fill="#eaf6ed">공중 디인증 · 스위치 포트</text></g><g><text x="24" y="308" font-weight="600" fill="#eaf6ed">NBA 기반</text><rect x="170" y="280" width="240" height="48" rx="8" fill="none" stroke="#6b8c75" stroke-width="1.25"></rect><text x="290" y="308" text-anchor="middle" fill="#eaf6ed">흐름 수집기 (NetFlow)</text><path d="M410 304H478" fill="none" stroke="#6b8c75" stroke-width="1.25" marker-end="url(#ipst-arrow)"></path><rect x="480" y="280" width="240" height="48" rx="8" fill="#96d5a8" fill-opacity="0.12" stroke="#96d5a8" stroke-width="2"></rect><text x="600" y="308" text-anchor="middle" fill="#eaf6ed">방화벽·라우터·스크러빙</text></g></svg>
