<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Neo6424의 개발과 보안 기록">
  <title>Neo6424의 블로그</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script src="posts.js?v=3" defer></script>
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <a class="skip" href="#content">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="./">Neo6424<span>.</span></a>
      <a class="github-link" href="https://github.com/Neo6424">GitHub <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main class="container" id="content">
    <div class="intro">
      <h1>Neo6424의 블로그</h1>
    </div>
    <div class="layout">
      <aside class="sidebar" aria-label="카테고리">
        <h2>카테고리</h2>
        <div id="filters" class="filters" role="group" aria-label="카테고리 필터"></div>
      </aside>
      <section class="archive" aria-labelledby="archive-title">
        <div class="write-area">
          <label for="write-category">새 글 카테고리</label>
          <select id="write-category"></select>
          <a id="write-link" class="write-link" href="https://github.com/Neo6424/Neo6424.github.io/issues/new">글쓰기</a>
          <p>GitHub 로그인 후 글을 작성하세요. 제목 앞의 카테고리는 그대로 두세요. 게시된 글은 공개됩니다.</p>
        </div>
        <div class="archive-header">
          <div><h2 id="archive-title">전체 글</h2><p id="result-count" aria-live="polite"></p></div>
          <label class="search"><span class="sr-only">글 검색</span><input id="search" type="search" placeholder="글 검색"></label>
        </div>
        <div id="post-list" class="post-list"></div>
        <p id="load-status" role="status" aria-live="polite"></p>
        <p id="empty" class="empty" hidden>해당하는 글이 없습니다.</p>
      </section>
    </div>
  </main>
  <footer class="container footer">© Neo6424</footer>
  <dialog id="post-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" type="button" aria-label="글 닫기">×</button>
    <div id="dialog-content"></div>
  </dialog>
</body>
</html>
