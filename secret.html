<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>guest@blog</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, 'Cascadia Code', Consolas, 'Malgun Gothic', monospace; color: #e2e8e4; background: #0b0c0d; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 35px 22px; background: #0b0c0d; line-height: 1.65; }
    button, input { font: inherit; }
    button, a { cursor: pointer; }
    a { color: #9edee9; text-decoration: none; }
    a:hover { text-decoration: underline; }
    input:focus-visible, button:focus-visible, a:focus-visible, .output:focus-visible { outline: 2px solid #90e9ad; outline-offset: 3px; }
    .window { max-width: 920px; margin: 0 auto; overflow: hidden; border: 1px solid #343a3e; border-radius: 12px; background: #111315; box-shadow: 0 22px 70px #0008; }
    .bar { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 16px; border-bottom: 1px solid #363b3f; background: #26292c; color: #bdc5c8; font-size: 12px; }
    .dots { display: flex; gap: 7px; width: 54px; }
    .dots i { display: block; width: 9px; height: 9px; border-radius: 50%; background: #db7067; }
    .dots i:nth-child(2) { background: #d9b75b; } .dots i:nth-child(3) { background: #7cbf80; }
    .shell { width: 54px; text-align: right; color: #91a398; }
    main { padding: 38px clamp(22px, 5vw, 52px) 46px; }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #90e9ad; font-size: 13px; }
    .topline a { font-size: 12px; }
    h1 { margin: 26px 0 4px; color: #f0f7f2; font-size: clamp(24px, 4vw, 34px); letter-spacing: -.04em; }
    .subtitle { margin: 0 0 25px; color: #abbcb0; font: 14px/1.7 'Malgun Gothic', system-ui, sans-serif; }
    .console { border: 1px solid #343a3e; background: #111315; }
    .console-title { padding: 10px 16px; border-bottom: 1px solid #343a3e; color: #c9d9ce; background: #1d2022; font-size: 13px; }
    .console-title span { color: #90e9ad; }
    .output { min-height: 205px; max-height: min(52vh, 430px); overflow: auto; padding: 20px; white-space: pre-wrap; overflow-wrap: anywhere; color: #dce7df; }
    .output .command { color: #90e9ad; font-weight: 700; margin-bottom: 10px; }
    .output .text { white-space: pre-wrap; }
    .output .cat { color: #9bc6ff; line-height: 1.35; font-weight: 700; }
    .form { display: flex; align-items: center; gap: 10px; padding: 10px 16px 16px; }
    .prompt { color: #90e9ad; font-weight: 700; white-space: nowrap; }
    .path { color: #9fbef4; }
    .form input { min-width: 0; flex: 1; padding: 8px 4px; border: 0; border-bottom: 1px solid #385b42; border-radius: 0; background: transparent; color: #eef8f0; caret-color: #90e9ad; }
    .form input::placeholder { color: #82958a; }
    .form button { padding: 7px 13px; border: 1px solid #52795c; background: #1a2d20; color: #b8eac6; }
    .form button:hover { background: #294634; }
    .hint { margin: 0; padding: 0 16px 15px; color: #aabbb0; font: 12px/1.6 'Malgun Gothic', system-ui, sans-serif; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 560px) { body { padding: 16px 10px; } main { padding: 30px 18px 36px; } .form { gap: 7px; padding-inline: 12px; } .prompt { font-size: 12px; } .output { min-height: 180px; padding: 16px; } }
  </style>
</head>
<body>
  <div class="window">
    <div class="bar" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span><span>guest@blog: ~</span><span class="shell">bash</span></div>
    <main>
      <div class="topline"><span>guest@blog:~$</span><a href="./">← 블로그로</a></div>
      <h1>숨겨진 공간</h1>
      <p class="subtitle">무언가를 발견했습니다.</p>
      <section class="console" aria-label="숨겨진 터미널">
        <div class="console-title"><span>&gt;_</span> guest@blog</div>
        <div id="output" class="output" role="log" aria-live="polite" tabindex="0"><div class="cat"> /\_/\
( o.o )
 &gt; ^ &lt;</div><div class="text"><code>help</code>를 입력해 둘러보세요.</div></div>
        <form id="form" class="form" autocomplete="off">
          <label class="sr-only" for="command">명령어</label>
          <span class="prompt" aria-hidden="true">guest@blog:<span class="path">~</span>$</span>
          <input id="command" type="text" placeholder="help" spellcheck="false" autofocus>
          <button type="submit">실행</button>
        </form>
        <p class="hint"><code>help</code> · <code>ls</code> · <code>exit</code> · Tab 자동 완성 <span id="completion" role="status" aria-live="polite"></span></p>
      </section>
    </main>
  </div>
  <script>
    (() => {
      const form = document.getElementById('form');
      const input = document.getElementById('command');
      const output = document.getElementById('output');
      const completion = document.getElementById('completion');
      const history = [];
      let index = 0, draft = '', completionState = '';
      function clearCompletion() { completion.textContent = ''; completionState = ''; }
      function line(text, className) {
        const item = document.createElement('div');
        item.className = className;
        item.textContent = text;
        output.append(item);
      }
      form.addEventListener('submit', event => {
        event.preventDefault();
        const raw = input.value;
        const command = raw.trim();
        if (!command) return;
        history.push(raw); index = history.length; draft = ''; input.value = ''; clearCompletion();
        if (command === 'exit') { location.assign('./'); return; }
        output.replaceChildren(); output.scrollTop = 0;
        if (command === 'clear') return;
        line(`guest@blog:~$ ${command}`, 'command');
        switch (command) {
          case 'help': line('ls                 파일 목록\ncat message.txt    메시지 읽기\ncat cat.txt        고양이 보기\nwhoami             현재 사용자\nclear              화면 비우기\nexit               블로그로 돌아가기', 'text'); break;
          case 'ls': line('message.txt    cat.txt', 'text'); break;
          case 'cat message.txt': line('발견 완료.', 'text'); break;
          case 'cat cat.txt': line(' /\\_/\\\n( o.o )\n > ^ <', 'cat'); break;
          case 'whoami': line('guest', 'text'); break;
          default: line('알 수 없는 명령어입니다. help를 입력해 보세요.', 'text');
        }
      });
      input.addEventListener('input', clearCompletion);
      input.addEventListener('keydown', event => {
        if (event.key === 'Tab' && !event.isComposing && !event.shiftKey && !event.ctrlKey && !event.altKey && !event.metaKey) {
          const value = input.value;
          const position = input.selectionStart;
          if (!value.trim() || position !== input.selectionEnd || position !== value.length) return;
          const match = /^(\s*cat\s+)(\S*)$/.exec(value);
          const commandMatch = /^(\s*)(\S+)$/.exec(value);
          const candidates = match ? ['message.txt', 'cat.txt'] : commandMatch ? ['help', 'ls', 'cat', 'whoami', 'clear', 'exit'] : [];
          const prefix = match ? match[2] : commandMatch ? commandMatch[2] : '';
          const matches = candidates.filter(candidate => candidate.startsWith(prefix));
          if (!matches.length) { clearCompletion(); return; }
          const common = matches.reduce((a, b) => { let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return a.slice(0, i); });
          const result = matches.length === 1 ? matches[0] + ' ' : common;
          if (result !== prefix) { event.preventDefault(); input.setRangeText(result, position - prefix.length, position, 'end'); clearCompletion(); return; }
          if (matches.length > 1 && completionState !== value) { event.preventDefault(); completion.textContent = ' 후보: ' + matches.join('  '); completionState = value; }
          else clearCompletion();
          return;
        }
        if ((event.key !== 'ArrowUp' && event.key !== 'ArrowDown') || event.isComposing || event.keyCode === 229 || event.shiftKey || event.ctrlKey || event.altKey || event.metaKey || !history.length) return;
        event.preventDefault();
        if (event.key === 'ArrowUp') { if (index === history.length) draft = input.value; index = Math.max(0, index - 1); }
        else index = Math.min(history.length, index + 1);
        input.value = index === history.length ? draft : history[index];
        clearCompletion();
        input.setSelectionRange(input.value.length, input.value.length);
      });
    })();
  </script>
</body>
</html>
